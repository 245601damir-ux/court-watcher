name: court-watcher

on:
  schedule:
    - cron: "7 * * * *"   # каждый час (UTC); можно "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # state.json между запусками — чтобы не слать одни и те же слоты
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: go run .
        env:
          COMPANY_ID: "521176"
          ALTEGIO_TOKEN: ${{ secrets.ALTEGIO_TOKEN }}
          STAFF_IDS: ${{ vars.STAFF_IDS }}
          NAME_FILTER: ${{ vars.NAME_FILTER }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
