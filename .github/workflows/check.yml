name: court-watcher

# Расписание Actions - best-effort: опоздавшие срабатывания отбрасываются,
# а не ставятся в очередь. При cron "*/15" окно между срабатываниями всего
# 15 минут, поэтому GitHub съедал большую их часть и фактический интервал
# выходил 27-60 минут. Поэтому крон часовой, а 15-минутный шаг делает цикл
# внутри прогона - ему throttling GitHub уже не мешает.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: court-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70   # job может тянуться почти час: ждёт четверти до верха следующего часа
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false   # зависимостей нет, go.sum тоже - иначе шлёт warning каждый прогон

      # state.json между прогонами - чтобы не слать одни и те же слоты.
      # Внутри прогона все 4 проверки пишут в один и тот же файл, так что
      # дубли не уходят и между ними.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: go build -o court-watcher .

      - name: проверка в :00 :15 :30 :45
        env:
          COMPANY_ID: "521176"
          API_BASE: ${{ vars.API_BASE }}
          ALTEGIO_TOKEN: ${{ secrets.ALTEGIO_TOKEN }}
          STAFF_IDS: ${{ vars.STAFF_IDS }}
          NAME_FILTER: ${{ vars.NAME_FILTER }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # автобронь: без BOOK_NAME/BOOK_PHONE не бронирует, только уведомляет
          BOOK_HOURS: ${{ vars.BOOK_HOURS }}
          BOOK_KINDS: ${{ vars.BOOK_KINDS }}
          BOOK_MAX: ${{ vars.BOOK_MAX }}
          BOOK_TOTAL: ${{ vars.BOOK_TOTAL }}
          BOOK_MIN_LEAD: ${{ vars.BOOK_MIN_LEAD }}
          TZ_OFFSET: ${{ vars.TZ_OFFSET }}
          BOOK_NAME: ${{ secrets.BOOK_NAME }}
          BOOK_PHONE: ${{ secrets.BOOK_PHONE }}
          BOOK_EMAIL: ${{ secrets.BOOK_EMAIL }}
        run: |
          # Крон приходит в произвольную минуту (GitHub опаздывает), поэтому
          # каждую проверку выравниваем на ближайшую четверть часа. Работаем до
          # верха следующего часа - дальше эстафету принимает следующий прогон,
          # так что наложения прогонов не копятся.
          deadline=$(( ( $(date -u +%s) / 3600 + 1 ) * 3600 ))
          fail=0
          n=0
          while :; do
            now=$(date -u +%s)
            next=$(( (now / 900 + 1) * 900 ))
            [ "$next" -gt "$deadline" ] && break
            sleep $(( next - now ))
            n=$(( n + 1 ))
            echo "::group::проверка $n  ($(date -u '+%H:%M:%S') UTC)"
            ./court-watcher || fail=1   # не прерываем цикл: следующая проверка может пройти
            echo "::endgroup::"
          done
          echo "проверок за прогон: $n"
          exit $fail   # падение любой проверки должно быть видно в Actions

      - name: save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
