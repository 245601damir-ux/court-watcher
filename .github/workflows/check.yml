name: court-watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (UTC); Actions может опаздывать на 5-15 минут,
                             # так что фактический интервал плавает
  workflow_dispatch: {}

# чтобы два запуска не писали state одновременно
concurrency:
  group: court-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false   # зависимостей нет, go.sum тоже — иначе шлёт warning каждый прогон

      # state.json между запусками — чтобы не слать одни и те же слоты
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: go run .
        env:
          COMPANY_ID: "521176"
          API_BASE: ${{ vars.API_BASE }}
          ALTEGIO_TOKEN: ${{ secrets.ALTEGIO_TOKEN }}
          STAFF_IDS: ${{ vars.STAFF_IDS }}
          NAME_FILTER: ${{ vars.NAME_FILTER }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # автобронь: без BOOK_NAME/BOOK_PHONE не бронирует, только уведомляет
          BOOK_HOURS: ${{ vars.BOOK_HOURS }}
          BOOK_KINDS: ${{ vars.BOOK_KINDS }}
          BOOK_MAX: ${{ vars.BOOK_MAX }}
          BOOK_TOTAL: ${{ vars.BOOK_TOTAL }}
          BOOK_NAME: ${{ secrets.BOOK_NAME }}
          BOOK_PHONE: ${{ secrets.BOOK_PHONE }}
          BOOK_EMAIL: ${{ secrets.BOOK_EMAIL }}

      - name: save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
